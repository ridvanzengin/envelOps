# Copied (not symlinked) onto the shared VM at
# /opt/agritwin/deploy/infra/nginx/conf.d/envelops.conf -- see
# ../scripts/deploy.sh and SERVER_SETUP.md. This file is the reviewed,
# versioned source of truth; the copy on the VM is a deploy artifact, not
# something edited in place. Modeled on IoTOps's own deploy/nginx/iotops.conf
# (same shared VM, same infra_proxy network) -- see that file for the
# fuller reasoning behind each pattern used here; only what's genuinely
# different for this app is re-explained below.

# -- HTTP: redirect to HTTPS + certbot ACME challenge -----------------------
server {
    listen 80;
    server_name envelops.site www.envelops.site;

    resolver 127.0.0.11 valid=30s ipv6=off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# -- HTTPS -------------------------------------------------------------------
server {
    listen 443 ssl;
    server_name envelops.site www.envelops.site;

    ssl_certificate     /etc/letsencrypt/live/envelops.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/envelops.site/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    resolver 127.0.0.11 valid=30s ipv6=off;

    # Every proxy_pass target below uses `set $upstream ...; proxy_pass
    # $upstream;`, never a bare static `proxy_pass http://host:port` --
    # a static hostname is resolved once at nginx startup/reload and
    # cached indefinitely, so any redeploy that recreates backend/frontend
    # (a new container = a new IP) would 502 until the next manual nginx
    # reload otherwise. IoTOps hit this for real the first time it added a
    # new service; starting from the fixed form here instead of
    # rediscovering it.

    # No location for /internal/ (app/commerce/fake_platform_api.py) --
    # deliberately absent, not just unauthenticated. That endpoint is
    # meant to be reachable only from inside this app's own containers
    # (ENVELOPS_INTERNAL_API_BASE_URL points at envelops-backend-1
    # directly, never through this vhost) -- requests to it from outside
    # fall through to the SPA location below and just get index.html.

    # Backend routes with a real bare `@router.get("")` endpoint that
    # ISN'T also a frontend page route (docs/ARCHITECTURE.md §9,
    # frontend/vite.config.ts's own dev-proxy comment has the full
    # reasoning) -- these two need an exact-match location in addition to
    # the trailing-slash one below, unlike every other router prefix.
    #
    # Found live (2026-08-05, first real production use of the
    # conversation rail after launch): the trailing-slash companion
    # location below was never actually added when this file was first
    # written, despite this comment already claiming it existed. Every
    # nested path under these two prefixes -- GET /conversations/{id}/
    # messages, POST /escalations/{id}/resolve, GET/POST/DELETE
    # /escalations/trigger-phrases -- matched no backend rule and fell
    # through to the `location /` SPA block instead, silently returning
    # index.html (200 OK, text/html) rather than JSON or a 404. The
    # frontend's apiGet() only treats a non-401 ApiError specially; a
    # JSON.parse() SyntaxError on HTML falls into the same generic
    # "couldn't load" catch-all, so this looked like an application bug
    # from the browser, not a routing gap. Confirmed via `curl -sI
    # https://envelops.site/conversations/<uuid>/messages` returning
    # text/html before this fix.
    location = /conversations {
        set $upstream http://envelops-backend-1:8000;
        proxy_pass         $upstream;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location /conversations/ {
        set $upstream http://envelops-backend-1:8000;
        proxy_pass         $upstream;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location = /escalations {
        set $upstream http://envelops-backend-1:8000;
        proxy_pass         $upstream;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location /escalations/ {
        set $upstream http://envelops-backend-1:8000;
        proxy_pass         $upstream;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # /events is the SSE conversation-rail stream (app/events/api.py,
    # EventSourceResponse) -- must come before the general trailing-slash
    # block below, same reasoning as IoTOps's /api/event/stream: buffering
    # off + a long read timeout, or nginx silently kills/buffers the
    # long-lived connection.
    location /events/ {
        set $upstream http://envelops-backend-1:8000;
        proxy_pass         $upstream;
        proxy_http_version 1.1;
        proxy_buffering    off;
        proxy_read_timeout 24h;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Every other backend router prefix (app/main.py) is also a frontend
    # page route with the same bare name (Dashboard, Channels, Knowledge,
    # etc.) -- a trailing slash is what disambiguates "the API" from "the
    # page" in both this config and frontend/vite.config.ts's dev proxy,
    # which this mirrors exactly. A bare `/dashboard` (no trailing
    # segment) falls through to the SPA location below and renders the
    # Dashboard page; `/dashboard/stats` hits the backend.
    location ~ ^/(auth|channels|knowledge|leads|dashboard|test|tenants|system)/ {
        set $upstream http://envelops-backend-1:8000;
        proxy_pass         $upstream;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 10M;
    }

    location = /healthz {
        set $upstream http://envelops-backend-1:8000;
        proxy_pass         $upstream;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / {
        set $upstream http://envelops-frontend-1:80;
        proxy_pass         $upstream;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
